name: Release GHCR

# Builds this fork from source and publishes it to ghcr.io/<owner>/watchtower.
# Standalone counterpart to the upstream goreleaser pipeline (build.yaml),
# which hardcodes the upstream image names and requires Docker Hub secrets;
# this workflow needs only the repo-scoped GITHUB_TOKEN.

on:
  workflow_dispatch:
  push:
    branches:
      - dist

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -tags containers_image_openpgp ./...

  publish:
    name: Build and push image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git-describe reaches the upstream release tags.
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/watchtower" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          # gzip layer compression (the buildx default) is required here: the
          # whole point of this fork is serving daemons that cannot pull zstd.
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
